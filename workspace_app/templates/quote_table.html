<div class="table-wrap"><table><thead><tr><th>Description</th><th>Unit</th><th>Quantity</th><th>Unit price</th><th>Discount</th><th>Total</th></tr></thead><tbody>{% for line in c.lines %}<tr><td class="prose">{{ line.description }}</td><td>{{ line.unit }}</td><td>{{ line.quantity }}</td><td>{{ line.price if line.price!='' else 'Unpriced' }}</td><td>{{ line.discount }}%</td><td>{{ line.total if line.total is not none else 'Unpriced' }}</td></tr>{% endfor %}</tbody></table></div>
