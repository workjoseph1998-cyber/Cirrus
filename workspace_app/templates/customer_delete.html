{% extends 'base.html' %}{% block content %}<h1>Delete customer · {{ customer.data.name }}</h1><p>Files on disk are never removed. Business dependencies block permanent deletion.</p><ul>{% for d in dependencies %}<li>{{ d }}</li>{% endfor %}</ul><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="token" value="{{ token }}"><button formnovalidate name="action" value="archive">Archive customer and retain history</button><button formnovalidate name="action" value="restore">Restore customer visibility</button>{% if not dependencies %}<label>Type DELETE<input name="phrase" required></label><button name="action" value="delete" class="danger">Delete permanently</button>{% endif %}</form>{% endblock %}
