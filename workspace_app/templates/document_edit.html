{% extends 'base.html' %}{% block content %}<div class="heading"><h1>{{ d.type }}</h1><a href="/documents/{{ r.id }}/manage">Management & history</a></div><p>Created {{ r.created or 'Unknown' }} · Last modified {{ r.updated }} · {{ d.number }} · Version {{ d.revision }}.0</p><form method="post" class="card" data-unsaved><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="snapshot" value="{{ snapshot }}"><label>Document title<input name="title" value="{{ d.title }}" required></label><div class="form-grid"><label>Structured reference<input name="number" value="{{ d.number }}" required maxlength="80"></label><label>Subject<input name="subject" value="{{ d.subject }}" required></label><label>Document date<input type="date" name="date" value="{{ d.date }}" required></label><label>Contact<textarea name="contact">{{ d.contact }}</textarea></label><label>Status<select name="status" aria-label="Status">{% for s in statuses %}<option {{ 'selected' if d.status==s }}>{{ s }}</option>{% endfor %}</select></label></div><label>Content<textarea name="content" rows="20">{{ d.content }}</textarea></label><button>Save document</button><button name="regenerate" value="yes" class="secondary">Regenerate title & save</button></form><div class="toolbar"><a class="button" href="/documents/{{ r.id }}/print">Print / Save PDF</a><a class="button secondary" href="/documents/{{ r.id }}/txt">Export text</a><form method="post" action="/record/{{ r.id }}/copy/revision"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>New revision</button></form><form method="post" action="/record/{{ r.id }}/copy/duplicate"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>Duplicate as new document</button></form></div>{% endblock %}
