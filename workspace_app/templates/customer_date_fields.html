<label>Date range<select name="period">{% for value,title in [('month','This month'),('last_month','Last month'),('year','This year'),('custom','Custom range'),('all','All time')] %}<option value="{{ value }}" {{ 'selected' if request.args.get('period','month')==value }}>{{ title }}</option>{% endfor %}</select></label><label>Start<input type="date" name="start" value="{{ request.args.get('start','') }}"></label><label>End<input type="date" name="end" value="{{ request.args.get('end','') }}"></label>
