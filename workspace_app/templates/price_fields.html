<div class="form-grid"><label>Service / VM<select name="item_key" required>{% if price and price.item_key not in labels %}<option value="{{ price.item_key }}">Retired · {{ price.item_key }}</option>{% endif %}{% for item in options %}<option value="{{ item.key }}" {{ 'selected' if price.get('item_key')==item.key }}>{{ item.label }}</option>{% endfor %}</select></label><label>Billing basis<select name="billing">{% for value,label in [('monthly','Monthly'),('one_time','One-time')] %}<option value="{{ value }}" {{ 'selected' if price.get('billing')==value }}>{{ label }}</option>{% endfor %}</select></label><label>Unit price<input name="price" type="number" step="0.01" min="0" required value="{{ price.get('price','') }}"></label><label>Currency<input name="currency" maxlength="3" required value="{{ price.get('currency','USD') }}"></label><label>Effective from<input type="date" name="start" value="{{ price.get('start','') }}"></label><label>Effective until<input type="date" name="finish" value="{{ price.get('finish','') }}"></label><label>Status<select name="active"><option value="yes">Active</option><option value="no" {{ 'selected' if price and not price.active }}>Inactive</option></select></label><label>Change reason<input name="reason" required placeholder="Required for the history"></label><label class="wide">Notes<textarea name="notes">{{ price.get('notes','') }}</textarea></label></div>
