<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ d.title }}</title><link rel="stylesheet" href="/static/quotation.css"><script defer src="/static/app.js"></script></head><body class="document"><div class="print-toolbar"><button id="print">Print / Save as PDF</button><a href="/documents/{{ r.id }}/manage">Back to document details</a></div><article><h1 class="document-strip">{{ d.type }}</h1><div class="cirrus-document-header"><img src="/static/cirrus-logo.png" alt="Cirrus" class="header-logo"><div class="header-fields"><b>Messrs.</b><span>{{ d.customer }}</span><b>Contact</b><span class="preserve">{{ d.contact }}</span><b>Project</b><span>{{ d.subject }}</span></div><div class="header-fields header-right"><b>Date</b><span>{{ d.date }}</span><b>Ref</b><span>{{ d.number }}</span></div></div><h2>{{ d.subject }}</h2><div class="preserve prose">{{ d.content }}</div></article></body></html>
