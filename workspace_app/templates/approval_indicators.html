{% macro approval_dots(p) -%}
<a class="approval-progress-summary" data-approval-progress="{{ p.quote_id }}" href="/quotes/{{ p.quote_id }}/approval"><span class="approval-dots" aria-label="Approvers">{% for dot in p.dots %}<span class="approval-dot-wrap"><span class="approval-dot {{ 'is-approved' if dot.approved }}" tabindex="0" role="img" aria-label="{{ dot.tooltip }}" title="{{ dot.tooltip }}"></span><span class="approval-dot-tooltip" role="tooltip">{{ dot.tooltip }}</span></span>{% endfor %}</span><span class="approval-progress-count">{{ p.approved }} out of {{ p.total }} approved</span>{% if p.label %}<span class="approval-progress-label">{{ p.label }}</span>{% elif p.status in ['Declined','Changes requested'] %}<span class="badge flow-attention">{{ p.status }}</span>{% endif %}</a>
{%- endmacro %}
