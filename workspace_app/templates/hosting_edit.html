{% extends 'base.html' %}{% block content %}<div class="eyebrow">CIRRUS / HOSTING VMS</div><h1>{{ 'Edit' if row else 'Add' }} VM profile</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><div class="form-grid">{% for key,label,type in fields %}<label>{{ label }}{% if key=='price_status' %}<select name="{{ key }}">{% for v in ['Demo','Confirmed'] %}<option {{ 'selected' if d[key]==v }}>{{ v }}</option>{% endfor %}</select>{% else %}<input type="{{ type }}" name="{{ key }}" value="{{ d[key] }}" {% if type=='number' %}step="any" min="0"{% endif %}>{% endif %}</label>{% endfor %}</div><button>Save VM profile</button> <a href="/hosting-vms">Cancel</a></form>{% if row %}<form method="post" action="/hosting-vms/{{ row.id }}/delete" data-confirm="Remove this VM profile? Existing quotation rows will keep their saved details."><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="danger">Delete VM profile</button></form>{% endif %}{% endblock %}
