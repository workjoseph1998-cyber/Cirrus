<div class="customer-workspace-header"><div class="customer-monogram" aria-hidden="true">{{ customer.data.name[:2]|upper }}</div><div class="customer-identity"><p class="breadcrumbs"><a href="/customers" data-smart-back>Customers</a><span aria-hidden="true"> / </span>{{ customer.data.name }}</p><h1>{{ customer.data.name }}</h1><p class="muted customer-contact">{{ customer.data.contact or 'No primary contact recorded' }}</p></div><div class="customer-header-actions">{% if can_edit(customer) %}<a class="button secondary" href="/edit/{{ customer.kind }}/{{ customer.id }}">✎ Edit customer</a>{% endif %}<a class="button secondary" href="/customers/{{ customer.id }}">Overview</a></div></div>
