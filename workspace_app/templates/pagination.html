{% if pagination is defined and pagination.total is defined %}<nav class="listing-pagination" aria-label="Pagination"><span>{{ pagination.total }} records · Page {{ pagination.page }} of {{ pagination.pages }}</span><div>{% for link in pagination.links %}<a class="button secondary {{ 'selected' if link.page==pagination.page }}" href="{{ link.url }}" {{ 'aria-current=page' if link.page==pagination.page }}>{{ link.page }}</a>{% endfor %}</div></nav>{% endif %}
