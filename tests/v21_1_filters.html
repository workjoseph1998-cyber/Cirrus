<form method="get" class="document-filters quotation-compact-filters" id="document-filters" data-remember-filters>
  <div class="quotation-primary-filters">
    <label class="quotation-search">Search<input name="q" aria-label="Search documents" placeholder="Customer, title or reference…" value="{{ request.args.get('q','') }}"></label>
    <div class="quotation-customer-filter"><label for="quotation-customer">Customer</label><div class="quotation-customer-controls"><select id="quotation-customer" name="customer_id"><option value="">All customers</option>{% for c in customer_choices %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('customer_id')==c.id }}>{{ c.name }}</option>{% endfor %}</select><details class="quotation-customer-search"><summary aria-label="Search customer list" title="Search customer list">⌕</summary><div><label for="quotation-customer-search">Find customer<input type="search" id="quotation-customer-search" class="selector-search" data-select="quotation-customer" placeholder="Search customers…"></label><small>Filters the customer dropdown.</small></div></details></div></div>
    <label class="quotation-range">Range<select aria-label="Range" name="period" id="document-period">{% for val,text in [('all','All dates'),('month','This month'),('last_month','Last month'),('year','This year'),('custom','Custom range')] %}<option value="{{ val }}" {{ 'selected' if request.args.get('period','all')==val }}>{{ text }}</option>{% endfor %}</select></label>
    <label class="quotation-visibility">Visibility<select aria-label="Visibility" name="archive">{% for v in ['active','archived','all'] %}<option value="{{ v }}" {{ 'selected' if request.args.get('archive','active')==v }}>{{ v|title }}</option>{% endfor %}</select></label>
    <div class="quotation-filter-buttons"><button>Apply filters</button><button type="button" class="secondary" id="toggle-quotation-filters" aria-controls="quotation-advanced-filters" aria-expanded="false">More filters{% if advanced.labels %} <span class="badge">{{ advanced.labels|length }}</span>{% endif %}</button><a data-clear-list href="/list/quote">Clear filters</a></div>
  </div>
  <div class="quotation-custom-dates"><label data-custom-date {{ 'hidden' if request.args.get('period')!='custom' }}>From<input type="date" aria-label="From" name="start" value="{{ request.args.get('start','') }}"></label><label data-custom-date {{ 'hidden' if request.args.get('period')!='custom' }}>To<input type="date" aria-label="To" name="end" value="{{ request.args.get('end','') }}"></label></div>
  <div id="quotation-advanced-filters" class="quotation-advanced-filters" hidden>
    <label>Month<select aria-label="Month" name="filter_month"><option value="0">All months</option>{% for m in range(1,13) %}<option value="{{ m }}" {{ 'selected' if request.args.get('filter_month')==m|string }}>{{ '%02d'|format(m) }}</option>{% endfor %}</select></label>
    <label>Year<select aria-label="Year" name="filter_year"><option value="all">All years</option>{% for y in years %}<option value="{{ y }}" {{ 'selected' if request.args.get('filter_year')==y|string }}>{{ y }}</option>{% endfor %}</select></label>
    <label>Date basis<select aria-label="Date basis" name="basis">{% for value,text in [('created','Creation date'),('date','Document date'),('updated','Last modified'),('sent','Recorded sent date')] %}<option value="{{ value }}" {{ 'selected' if request.args.get('basis','created')==value }}>{{ text }}</option>{% endfor %}</select></label>
    <label>Type<select aria-label="Type" name="type"><option value="">All types</option>{% for t in types %}<option {{ 'selected' if request.args.get('type')==t }}>{{ t }}</option>{% endfor %}</select></label>
    <label>Owner<select aria-label="Owner" name="owner"><option value="">All owners</option><option value="unassigned" {{ 'selected' if request.args.get('owner')=='unassigned' }}>Unassigned</option>{% for id,name in users.items() %}<option value="{{ id }}" {{ 'selected' if request.args.get('owner')==id }}>{{ name }}</option>{% endfor %}</select></label>
    <label>Business status<select aria-label="Business status" name="status"><option value="">All statuses</option>{% for s in workflow_statuses %}<option {{ 'selected' if request.args.get('status')==s }}>{{ s }}</option>{% endfor %}</select></label>
    <label>Sort<select aria-label="Sort" name="sort">{% for value,label in [('activity','Latest activity'),('title','Title'),('customer','Customer'),('reference','Reference')] %}<option value="{{ value }}" {{ 'selected' if request.args.get('sort','activity')==value }}>{{ label }}</option>{% endfor %}</select></label>
    <label>Rows<select aria-label="Rows" name="per_page">{% for n in [25,50,100] %}<option value="{{ n }}" {{ 'selected' if per_page==n }}>{{ n }}</option>{% endfor %}</select></label>
  </div>
  {% if advanced.labels %}<p class="quotation-applied-filters">Additional settings applied: {{ advanced.labels|join(', ') }}. Open More filters to review.</p>{% endif %}
</form>
